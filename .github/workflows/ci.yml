name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false

      - name: Verificar formato
        run: |
          if [ "$(gofmt -l .)" != "" ]; then
            echo "❌ Código sin formatear:"
            gofmt -l .
            exit 1
          fi
          echo "✅ Formato correcto"

      - name: Compilar
        run: go build -o /dev/null ./...

      - name: Tests
        run: go test ./... -v -timeout 60s

      - name: Validate Linux installer syntax
        run: bash -n install.sh setup-wsl.sh

  package-nightly:
    name: Publish Linux x86_64 installer bundle
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build and package kern
        run: |
          mkdir -p dist/profiles
          go build -trimpath -ldflags='-s -w' -o dist/kern ./cmd/
          cp profiles/*.toml dist/profiles/
          printf '%s\n' "$GITHUB_SHA" > dist/commit.txt
          tar -czf kern-linux-amd64.tar.gz -C dist kern profiles commit.txt
          sha256sum kern-linux-amd64.tar.gz > kern-linux-amd64.tar.gz.sha256
          ./dist/kern --help >/dev/null
          tar -tzf kern-linux-amd64.tar.gz | grep -qx kern
          tar -tzf kern-linux-amd64.tar.gz | grep -qx profiles/node.toml
      - name: Publish rolling installer release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: kern-nightly
          target_commitish: ${{ github.sha }}
          name: Kern nightly
          body: Automated Linux x86_64 installer bundle from main.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            kern-linux-amd64.tar.gz
            kern-linux-amd64.tar.gz.sha256

  windows-installer:
    name: Windows WSL installer syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell installer
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "windows-install-requirements.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }
