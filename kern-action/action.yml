name: 'Kern'
description: 'Build, verify and optionally push an application as a Kern unikernel'
author: 'druxuss'

inputs:
  push:
    description: 'Optional image reference to push (for example ghcr.io/user/app:tag)'
    required: false
    default: ''
  registry-user:
    description: 'Registry username'
    required: false
    default: ''
  registry-token:
    description: 'Registry token or password'
    required: false
    default: ''
  working-directory:
    description: 'Directory containing the application and Kernfile'
    required: false
    default: '.'

outputs:
  image-path:
    description: 'Path to the built .uki image'
    value: ${{ steps.build.outputs.image-path }}

runs:
  using: 'composite'
  steps:
    - name: Install Kern and runtime dependencies
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --location --silent --show-error --retry 3 \
          https://raw.githubusercontent.com/druxuss/Kern/main/install.sh | bash
        kern --help >/dev/null

    - name: Build unikernel
      id: build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        kern build
        echo "image-path=$(pwd)/.unikernel/image.uki" >> "$GITHUB_OUTPUT"

    - name: Verify image
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: kern verify

    - name: Push image
      if: inputs.push != ''
      shell: bash
      env:
        KERN_PUSH: ${{ inputs.push }}
        KERN_REGISTRY_USER: ${{ inputs.registry-user }}
        KERN_REGISTRY_TOKEN: ${{ inputs.registry-token }}
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        kern push "$KERN_PUSH" \
          --username "$KERN_REGISTRY_USER" \
          --password "$KERN_REGISTRY_TOKEN"
